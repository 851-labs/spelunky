[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/pxfm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
gmk = { path = "crates/gmk" }
assets = { path = "crates/assets" }
gm = { path = "crates/gm" }
trace = { path = "crates/trace" }
game = { path = "crates/game" }
config = { path = "crates/config" }
draw = { path = "crates/draw" }
audio = { path = "crates/audio" }
gml = { path = "crates/gml" }
transpile = { path = "crates/transpile" }
tools = { path = "crates/tools" }
update = { path = "crates/update" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Proc-macros' and build scripts' dependencies with debuginfo, as the dev profile has it. Cargo's default leaves
# it out of a dependency that's only a build one, but keeps it in one that's a normal one too (naga's
# unicode-ident), to build it once; so `scripts/cargo test -p game`, whose graph hasn't naga, built proc-macro2,
# syn and every crate with a derive (serde, thiserror, bytemuck) again rather than reuse the workspace's
# (crates/workspace-hack, 851-3738). The dev profile only: the release builds are as they were.
[profile.dev.build-override]
debug = true
