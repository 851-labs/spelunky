[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/pxfm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
gmk = { path = "crates/gmk" }
assets = { path = "crates/assets" }
gm = { path = "crates/gm" }
trace = { path = "crates/trace" }
game = { path = "crates/game" }
config = { path = "crates/config" }
draw = { path = "crates/draw" }
audio = { path = "crates/audio" }
gml = { path = "crates/gml" }
transpile = { path = "crates/transpile" }
tools = { path = "crates/tools" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
