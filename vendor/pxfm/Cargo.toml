# pxfm 0.1.30 (https://github.com/awxkee/pxfm), trimmed and patched for the Spelunky port (851-3167, 851-3173, 851-3174, 851-3257).
# See README.spelunky.md. tools/oracle/build writes this version into OpenGMK's Cargo.lock (patch 0007).
[package]
name = "pxfm"
version = "0.1.30+spelunky.4"
edition = "2024"
rust-version = "1.85"
authors = ["Radzivon Bartoshyk"]
description = "A model of the x87 for GameMaker 8's math and a correctly rounded hypot; and correctly rounded sin, cos, tan, atan and atan2 (without runtime CPU dispatch), now only for tools/math-probe"
license = "BSD-3-Clause OR Apache-2.0"
repository = "https://github.com/awxkee/pxfm"
publish = false

[lib]
path = "src/lib.rs"

# Its own workspace, so tests run here too (the port's workspace excludes it).
[workspace]
