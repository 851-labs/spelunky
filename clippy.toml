# The platform's libm differs between macOS, wasm32 and the oracle's glibc in the last bit, so game state
# must never come from these: use the correctly rounded versions in `gm::math` (851-3167), or add one
# there. Code that only draws can opt out with `#[allow(clippy::disallowed_methods)]`.
disallowed-methods = [
    { path = "f64::sin", reason = "use gm::math::sin (same bits on every platform)" },
    { path = "f64::cos", reason = "use gm::math::cos (same bits on every platform)" },
    { path = "f64::sin_cos", reason = "use gm::math::sin and gm::math::cos" },
    { path = "f64::atan", reason = "use gm::math::arctan (same bits on every platform)" },
    { path = "f64::atan2", reason = "use gm::math::atan2 (same bits on every platform)" },
    { path = "f64::powi", reason = "unspecified precision; use gm::math::powi" },
    { path = "f64::hypot", reason = "platform libm; GML point_distance is sqrt(dx*dx + dy*dy)" },
    { path = "f64::tan", reason = "platform libm; add a correctly rounded version to gm::math" },
    { path = "f64::asin", reason = "platform libm; add a correctly rounded version to gm::math" },
    { path = "f64::acos", reason = "platform libm; add a correctly rounded version to gm::math" },
    { path = "f64::exp", reason = "platform libm; add a correctly rounded version to gm::math" },
    { path = "f64::exp2", reason = "platform libm; add a correctly rounded version to gm::math" },
    { path = "f64::exp_m1", reason = "platform libm; add a correctly rounded version to gm::math" },
    { path = "f64::ln", reason = "platform libm; add a correctly rounded version to gm::math" },
    { path = "f64::ln_1p", reason = "platform libm; add a correctly rounded version to gm::math" },
    { path = "f64::log", reason = "platform libm; add a correctly rounded version to gm::math" },
    { path = "f64::log2", reason = "platform libm; add a correctly rounded version to gm::math" },
    { path = "f64::log10", reason = "platform libm; add a correctly rounded version to gm::math" },
    { path = "f64::powf", reason = "platform libm; add a correctly rounded version to gm::math" },
    { path = "f64::cbrt", reason = "platform libm; add a correctly rounded version to gm::math" },
    { path = "f64::sinh", reason = "platform libm; add a correctly rounded version to gm::math" },
    { path = "f64::cosh", reason = "platform libm; add a correctly rounded version to gm::math" },
    { path = "f64::tanh", reason = "platform libm; add a correctly rounded version to gm::math" },
    { path = "f64::asinh", reason = "platform libm; add a correctly rounded version to gm::math" },
    { path = "f64::acosh", reason = "platform libm; add a correctly rounded version to gm::math" },
    { path = "f64::atanh", reason = "platform libm; add a correctly rounded version to gm::math" },
    { path = "f32::sin", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::cos", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::sin_cos", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::tan", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::asin", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::acos", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::atan", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::atan2", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::exp", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::ln", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::powf", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::powi", reason = "unspecified precision; game state is f64, see gm::math" },
    { path = "f32::hypot", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::exp2", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::exp_m1", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::ln_1p", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::log", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::log2", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::log10", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::cbrt", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::sinh", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::cosh", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::tanh", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::asinh", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::acosh", reason = "platform libm; game state is f64, see gm::math" },
    { path = "f32::atanh", reason = "platform libm; game state is f64, see gm::math" },
    # The `libm` crate (a transitive dependency) is portable but not correctly rounded, so it disagrees with
    # gm::math (and the oracle) on a few percent of inputs. `allow-invalid` because no workspace crate
    # depends on it directly, so the paths only resolve once one does.
    { path = "libm::sin", reason = "not correctly rounded; use gm::math::sin", allow-invalid = true },
    { path = "libm::cos", reason = "not correctly rounded; use gm::math::cos", allow-invalid = true },
    { path = "libm::tan", reason = "not correctly rounded; add it to gm::math", allow-invalid = true },
    { path = "libm::atan", reason = "not correctly rounded; use gm::math::arctan", allow-invalid = true },
    { path = "libm::atan2", reason = "not correctly rounded; use gm::math::atan2", allow-invalid = true },
    { path = "libm::asin", reason = "not correctly rounded; add it to gm::math", allow-invalid = true },
    { path = "libm::acos", reason = "not correctly rounded; add it to gm::math", allow-invalid = true },
    { path = "libm::exp", reason = "not correctly rounded; add it to gm::math", allow-invalid = true },
    { path = "libm::log", reason = "not correctly rounded; add it to gm::math", allow-invalid = true },
    { path = "libm::pow", reason = "not correctly rounded; add it to gm::math", allow-invalid = true },
    { path = "libm::hypot", reason = "not correctly rounded; GML point_distance is sqrt(dx*dx + dy*dy)", allow-invalid = true },
    { path = "libm::sinf", reason = "not correctly rounded; game state is f64, see gm::math", allow-invalid = true },
    { path = "libm::cosf", reason = "not correctly rounded; game state is f64, see gm::math", allow-invalid = true },
    { path = "libm::atan2f", reason = "not correctly rounded; game state is f64, see gm::math", allow-invalid = true },
]
