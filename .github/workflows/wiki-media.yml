# The wiki's media between game releases (docs/wiki-media.md, "Publishing"), on one Mac mini, whose GPU the
# app's capture needs. On a push to main that changes what they're made from (PATHS below, checked inside
# the job, as mini.yml's `paths` are), it renders them with main's app (.github/actions/wiki-media-render,
# as build-native.yml does for a release), compares them with the last published media
# (scripts/wiki-media-diff), and if the site would show something new, publishes them as the GitHub Release
# wiki-media-<date>-<sha> (never the latest release) and pushes the branch wiki-media/<tag>, which pins it
# in site/wiki-media.txt (scripts/bump-wiki-media). Someone opens the pull request from that branch (the
# run's summary has the command): pr-ok must pass on it like any other, and merging it is the deploy.
#
# The workflow can't open that pull request itself: the repository doesn't let GitHub Actions create pull
# requests, and one its token opened would run no workflow (GitHub's rule for events its token causes), so
# pr-ok, which the "Protect main" ruleset requires, would never report.
#
# Run it by hand (Actions › Wiki media › Run workflow) to render a branch with `dry_run` (the default): it
# compares and reports, and leaves the package as the run's artifact, but publishes nothing. On main without
# it, it publishes whether or not the media changed (a change only to how clips are encoded, which the
# comparison doesn't see). Anywhere but main is a dry run.
name: Wiki media

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Render, package and compare, but publish nothing (off main, always)
        type: boolean
        default: true

permissions:
  contents: read

# One at a time. Merges that land while one renders coalesce into the newest (GitHub keeps one pending run
# per group), which compares against the last published media, not its push's parent, so the skipped runs'
# changes are in it.
concurrency:
  group: wiki-media-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # As in release.yml, for a workspace actions/checkout has to `git init`.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  media:
    name: Render and publish
    runs-on:
      group: Mac minis
      labels: [self-hosted, macOS, ARM64, codevisor-macos-arm64]
    timeout-minutes: 90
    # To publish the release and push the bump branch; the token goes only to the steps that do (and to the
    # one that reads the releases), never to one that builds the repository's code or runs what it built.
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
      # What the media are made from (git pathspecs): the specs and the replays clips are cut from; the
      # renderer, the app's capture, the drawing and the sound (crates/harness, app, draw, audio, and what
      # they share: config, trace); the sprite exporter and the asset extractor (crates/tools, assets, gmk,
      # gml, and reference/'s source); the scripts, the workspace's manifest and lock file, the pinned ffmpeg
      # and toolchain; the package's LICENSE; and this workflow. Not the game's own logic (crates/game, gm,
      # transpile): its changes reach the clips with the next game release, whose build renders them too (or
      # a hand run of this).
      PATHS: >-
        wiki/clips fidelity/replays crates/harness crates/app crates/draw crates/audio crates/config
        crates/trace crates/tools crates/assets crates/gmk crates/gml reference scripts/extract
        scripts/wiki-clips scripts/wiki-sprites scripts/wiki-media-package scripts/wiki-media-diff
        scripts/release/tools Cargo.toml Cargo.lock rust-toolchain.toml LICENSE .github/workflows/wiki-media.yml
        .github/actions/wiki-media-render
    steps:
      # The whole history and its tags, for the last published media and git describe. The workspace outlives
      # the job on a self-hosted runner, so the token isn't left in .git/config.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # The last published media at or before this commit: of the tags whose release is published with its
      # package, a game release's or a wiki-media-* one's, the one fewest commits back. (Not by the tags'
      # dates: a game release's tag is annotated, dated when it was tagged, and may come after media of a
      # later commit.) Then, for a push, whether anything the media are made from changed since.
      - name: Find the last media
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            echo "::notice::A dry run: nothing is published"
          fi
          # shellcheck disable=SC2016 # jq's $t, not the shell's
          published=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '
            .[] | select(.draft | not) | .tag_name as $t
            | select(any(.assets[]; .name == "\($t).tar.gz" or .name == "wiki-media-\($t).tar.gz")) | $t')
          base=
          for tag in $published; do
            git merge-base --is-ancestor "$tag" HEAD 2>/dev/null || continue
            behind=$(git rev-list --count "$tag..HEAD")
            if [ -z "$base" ] || [ "$behind" -lt "$nearest" ]; then
              base=$tag
              nearest=$behind
            fi
          done
          case $base in
            '') echo "no published media before this commit" ;;
            wiki-media-*) asset=$base.tar.gz ;;
            *) asset=wiki-media-$base.tar.gz ;;
          esac
          {
            echo "base=$base"
            echo "asset=${asset-}"
          } | tee -a "$GITHUB_OUTPUT"
          if [ -n "$base" ]; then
            read -ra paths <<<"$PATHS"
            echo "what the media are made from, changed since $base:"
            git diff --stat "$base" HEAD -- "${paths[@]}"
            if [ "$GITHUB_EVENT_NAME" = push ] && git diff --quiet "$base" HEAD -- "${paths[@]}"; then
              echo "nothing the media are made from changed since $base: skipping"
              echo "skip=true" >>"$GITHUB_OUTPUT"
            fi
          fi
      # Like a branch's native build (build-native.yml), with its cached target dir and settings, so each
      # serves the other. The app is a development build, the arm64 half of what a release would ship.
      - if: steps.base.outputs.skip != 'true'
        run: scripts/release/ci-setup cached
      - name: Build the app
        id: build
        if: steps.base.outputs.skip != 'true'
        run: |
          MACOSX_DEPLOYMENT_TARGET=11.0 scripts/cargo build --quiet --release --locked -p app --target aarch64-apple-darwin
          rm -rf "$RUNNER_TEMP/wiki-assets"
          scripts/extract --out "$RUNNER_TEMP/wiki-assets" >/dev/null
          {
            # The commit's date, not today's, so a re-run names the same release.
            echo "name=wiki-media-$(TZ=UTC git show -s --format=%cd --date=format-local:%Y-%m-%d HEAD)-${GITHUB_SHA::7}"
            # As scripts/wiki-clips captions them: the port's release and the commits since it.
            echo "port-version=$(git describe --tags --match 'v[0-9]*' --always)"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Render the wiki media
        if: steps.base.outputs.skip != 'true'
        uses: ./.github/actions/wiki-media-render
        with:
          name: ${{ steps.build.outputs.name }}
          port-version: ${{ steps.build.outputs.port-version }}
          app: ${{ env.CARGO_TARGET_DIR }}/aarch64-apple-darwin/release/app
          assets: ${{ runner.temp }}/wiki-assets
      - name: Compare with the last media
        id: compare
        if: steps.base.outputs.skip != 'true'
        env:
          NAME: ${{ steps.build.outputs.name }}
          BASE: ${{ steps.base.outputs.base }}
          ASSET: ${{ steps.base.outputs.asset }}
        run: |
          diff=$RUNNER_TEMP/wiki-media-diff.txt
          if [ -z "$BASE" ]; then
            echo "everything is new: no published media to compare with" >"$diff"
            changed=true
          else
            dir=$RUNNER_TEMP/wiki-media-base
            rm -rf "$dir"
            mkdir -p "$dir"
            curl -fsSL --retry 3 -o "$dir/$ASSET" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$BASE/$ASSET"
            status=0
            python3 -I scripts/wiki-media-diff "$dir/$ASSET" "target/$NAME.tar.gz" >"$diff" || status=$?
            case $status in
              0) changed=false ;;
              1) changed=true ;;
              *) exit "$status" ;;
            esac
          fi
          echo "changed=$changed" >>"$GITHUB_OUTPUT"
          {
            echo "### $NAME$([ "$DRY_RUN" = true ] && echo " (dry run: not published)")"
            echo "Compared with ${BASE:-nothing}: $([ "$changed" = true ] && echo "changed" || echo "the same")"
            echo '```'
            head -n 200 "$diff"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.base.outputs.skip != 'true' && env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.name }}
          path: target/${{ steps.build.outputs.name }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      # A push publishes only what the site would show differently; a hand run on main, whatever it rendered.
      # The release's tag is made at this commit. A re-run keeps a release it already published.
      - name: Publish
        if: >-
          steps.base.outputs.skip != 'true' && env.DRY_RUN != 'true' &&
          (steps.compare.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.build.outputs.name }}
          PORT_VERSION: ${{ steps.build.outputs.port-version }}
        run: |
          if gh release view "$NAME" >/dev/null 2>&1; then
            echo "$NAME is already published"
          else
            notes=$RUNNER_TEMP/wiki-media-notes.md
            {
              echo "The spelunky.ai wiki's sprites and clips at ${GITHUB_SHA::7}, recorded from the port $PORT_VERSION"
              echo "(docs/wiki-media.md). Spelunky (c) 2008, 2009 Derek Yu and Mossmouth, LLC; Spelunky User License"
              echo "v1.1b (LICENSE.txt inside). Made by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
              echo
              echo '```'
              head -n 200 "$RUNNER_TEMP/wiki-media-diff.txt"
              echo '```'
            } >"$notes"
            gh release create "$NAME" "target/$NAME.tar.gz" --target "$GITHUB_SHA" --title "Wiki media $NAME" \
              --notes-file "$notes" --latest=false
          fi
          # The pin, committed through the API (by github-actions[bot]) onto a new branch at this commit. Older
          # wiki-media/* branches go, and with them their pull requests, which this one supersedes.
          # A re-run finishes what an earlier one started: a branch it made, but didn't commit the pin to.
          branch=wiki-media/$NAME
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$GITHUB_SHA" >/dev/null
          fi
          contents="repos/$GITHUB_REPOSITORY/contents/site/wiki-media.txt"
          if gh api "$contents?ref=$branch" --jq .content | base64 --decode | grep -qxF "tag $NAME"; then
            echo "$branch already pins $NAME"
          else
            scripts/bump-wiki-media "$NAME"
            gh api -X PUT "$contents" -f branch="$branch" -f message="Wiki media: pin $NAME" \
              -f content="$(base64 <site/wiki-media.txt)" \
              -f sha="$(gh api "$contents?ref=$branch" --jq .sha)" >/dev/null
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/wiki-media/" --jq '.[].ref' |
            while read -r ref; do
              [ "$ref" = "refs/heads/$branch" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/$ref"
            done
          {
            echo "Published [$NAME]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$NAME) and pushed \`$branch\`."
            echo "To put it live, open its pull request:"
            echo '```sh'
            echo "gh pr create --repo $GITHUB_REPOSITORY --base main --head $branch --title 'Wiki media: pin $NAME' \\"
            echo "  --body 'Pins the wiki media $NAME (docs/wiki-media.md, \"Publishing\"), made by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.'"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: |
          rm -rf target/wiki-media target/wiki-media-*.tar.gz* "$RUNNER_TEMP/wiki-media-check" \
            "$RUNNER_TEMP/wiki-assets" "$RUNNER_TEMP/wiki-media-base" "$RUNNER_TEMP/wiki-media-diff.txt" \
            "$RUNNER_TEMP/wiki-media-notes.md"
