# One job on the self-hosted Mac minis: check out, set up Rust and Node (.github/actions/mini-toolchain), run a
# command, clean up. pr.yml and release.yml call it, so the runner group, the setup and the cleanup are in one
# place. With `paths`, a pull request that changes none of them skips the setup and the command, and the job
# succeeds: pr-ok needs every job to, and a job skipped with `if:` wouldn't.
name: Mac mini job

on:
  workflow_call:
    inputs:
      name:
        description: The job's name in the run's graph, after the calling job's ("Mac mini / Test suite")
        type: string
        required: true
      run:
        description: The command to run in the checkout (bash)
        type: string
        required: true
      timeout-minutes:
        type: number
        default: 60
      paths:
        description: >
          Only for a pull request that changes one of these (git pathspecs, space-separated); without it, or
          outside a pull request, always
        type: string
        default: ''

permissions:
  contents: read

env:
  # As in release.yml, for a workspace actions/checkout has to `git init` (a caller's env doesn't reach here).
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  run:
    name: ${{ inputs.name }}
    runs-on:
      group: Mac minis
      labels: [self-hosted, macOS, ARM64, codevisor-macos-arm64]
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      # The workspace outlives the job on a self-hosted runner, so the token isn't left in .git/config.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # For `paths`, the merge commit's parents too.
          fetch-depth: ${{ inputs.paths && 2 || 1 }}
      # A pull request's run checks out the pull request merged into its base, so what it changes is that merge
      # commit's diff from its first parent. Anything else (no merge commit) runs.
      - id: changes
        if: inputs.paths
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          read -ra paths <<<"$PATHS"
          if git rev-parse -q --verify HEAD^2 >/dev/null && git diff --quiet HEAD^1 HEAD -- "${paths[@]}"; then
            echo "nothing under $PATHS changed: skipping"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.skip != 'true'
        uses: ./.github/actions/mini-toolchain
      - if: steps.changes.outputs.skip != 'true'
        env:
          RUN: ${{ inputs.run }}
        run: eval "$RUN"
      - if: always()
        run: .github/actions/mini-toolchain/cleanup.sh
