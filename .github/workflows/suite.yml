# The test suite (scripts/check) on GitHub's Linux machines (x86_64), not the self-hosted Mac minis, which are shared
# with other projects and were the queue every pull request waited in (851-3953). pr.yml calls it for a pull request;
# a push to main runs it too, which checks main after each merge and saves the build cache every pull request's run
# starts from (a pull request's own cache only its later runs could use).
#
# Everything in scripts/check runs on Linux, fidelity-check's replays too (gm::math is the same everywhere), but
# crates/workspace-hack's checks, which are Apple silicon Macs' and skip themselves, and the macOS-only code, which
# Linux doesn't compile: pr.yml's mini job runs those (scripts/check --apple).
#
# Two machines side by side, each running half of it (scripts/check --part 1 and --part 2: together all of it), split
# by what they build (851-3998, docs/ci.md "Pull requests"), in a checkout of only what the suite reads; pr.yml
# runs it for a pull request that changes some of that (scripts/affected, 851-4008).
name: Test suite

on:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # main's pushes one at a time, never cancelled, so each run gets to save the cache (pushes close together: the
  # newest waits, and replaces any older one still waiting). A pull request's runs are pr.yml's to cancel.
  group: suite-${{ github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: false

env:
  # As in release.yml, for a workspace actions/checkout has to `git init`.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  check:
    name: Test suite
    strategy:
      # Each half's failures are its own: one failing doesn't hide the other's.
      fail-fast: false
      matrix:
        part: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only what scripts/check reads (scripts/affected's SUITE_RULES, which also decide when pr.yml runs it): the
      # rest is taken out of the checkout, so a step that reads a path the rules leave out fails here, as the file
      # isn't there, rather than a pull request changing it skipping the suite (docs/ci.md, "What a pull request
      # runs").
      - name: Only what the suite reads
        run: |
          python3 -I scripts/affected --rules suite | git sparse-checkout set --no-cone --stdin
          # scripts/check-sh finds the sh scripts it checks with git grep, which skips what's out of the checkout:
          # every one must be in it (--tracked: the ones it would check, from the index).
          scripts=$(scripts/check-sh --tracked)
          outside=$(comm -23 <(sort <<<"$scripts") <(git sparse-checkout check-rules <<<"$scripts" | sort))
          if [ -n "$outside" ]; then
            echo "::error::scripts/check-sh checks these, which the suite's sparse checkout leaves out: $outside"
            exit 1
          fi
      # What the app links on Linux: cpal's ALSA, gilrs' udev, and winit's Wayland and xkbcommon (pkg-config).
      - name: Linux libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev \
            libxkbcommon-dev
      # rust-toolchain.toml's toolchain, with its wasm32 targets.
      - run: rustup toolchain install --no-self-update
      # scripts/wasm-test runs gm's wasm32 tests under Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      # The registry and target/ between runs, in GitHub's cache (10 GB a repository), one for each half, as they
      # build different things. Saved only by main's run, which every pull request's can read (a pull request's own
      # could only be read by its later runs, and would push main's out).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check-${{ matrix.part }}
          save-if: ${{ github.event_name == 'push' }}
      # -x: the log shows every step it runs, each line with the runner's timestamp.
      - run: sh -x scripts/check --part "${{ matrix.part }}"
