# The updater's tests on each desktop platform (docs/updates.md): an end-to-end update from a fake older
# build to a fake newer one, with rollback, on macOS (a .app), Windows (a directory, with the running .exe
# renamed aside) and Linux (an AppImage). Only the update crate: no GPU, no game, a few minutes.
#
# pr.yml calls it on every pull request (it gates `pr-ok`) and release.yml before it publishes; like every
# other check it doesn't re-run on `main` after a merge (a release runs it again). It can also be run by
# hand (Actions › Updater tests › Run workflow). GitHub-hosted runners only, and no secrets: it's safe for
# pull requests from forks.
name: Updater tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # As in release.yml: init.defaultBranch for actions/checkout's `git init` (a caller's env doesn't reach here).
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  test:
    # GitHub adds the platform, "Tests (Windows x64)"; the matrix holds only that, and each job's machine
    # follows from it (pinned OS versions, not -latest: docs/ci.md).
    name: Tests
    strategy:
      fail-fast: false
      matrix:
        os: [macOS, Windows x64, Windows ARM64, Linux x64, Linux ARM64]
    runs-on: >-
      ${{ fromJSON('{"macOS": "macos-26", "Windows x64": "windows-2025", "Windows ARM64": "windows-11-arm",
      "Linux x64": "ubuntu-24.04", "Linux ARM64": "ubuntu-24.04-arm"}')[matrix.os] }}
    timeout-minutes: 30
    steps:
      # Everything but the wiki's media (docs/wiki-media.md), which the updater doesn't need: about 200 MB a
      # fresh machine would otherwise download. A partial clone, so their files aren't fetched at all.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/wiki/media/
      # rust-toolchain.toml's toolchain (its wasm targets come along; they're small).
      - run: rustup toolchain install --no-self-update
        shell: bash
      - run: cargo test --locked -p update
        shell: bash
