# The updater's tests on each desktop platform (docs/updates.md): an end-to-end update from a fake older
# build to a fake newer one, with rollback, on macOS (a .app), Windows (a directory, with the running .exe
# renamed aside) and Linux (an AppImage). Only the update crate: no GPU, no game, a few minutes.
# GitHub-hosted runners only, and no secrets: it's safe for pull requests from forks.
name: update

on:
  pull_request:
    paths:
      - "crates/update/**"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/update.yml"
  push:
    branches: [main]
    paths:
      - "crates/update/**"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/update.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest, windows-11-arm, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml's toolchain (its wasm targets come along; they're small).
      - run: rustup toolchain install
        shell: bash
      - run: cargo test --locked -p update
        shell: bash
