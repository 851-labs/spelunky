# Every pull request: the full local suite (scripts/check), the web build and, if it changes the site, the
# site's smoke test (site/test.sh), on the self-hosted Mac minis, and the updater's tests on GitHub's macOS,
# Windows and Linux machines (updater.yml). `pr-ok` is the one check the "Protect main" ruleset requires, so
# jobs can be added or renamed here without touching the ruleset.
#
# The repository is public: this runs untrusted code from pull requests on our own machines. So it's
# `pull_request` (never `pull_request_target`), with a read-only token, no secrets and no environment, and
# outside contributors' runs wait for approval (the repository's Actions setting).
#
# The minis also sign releases, so a pull request from a fork never runs on them at all, even if approved:
# only collaborators may open pull requests (the repository's `pull_request_creation_policy`), and if that
# ever changes, a fork's pull request skips the mini jobs below and fails `pr-ok`.
name: PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Mac mini
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/mini.yml
    with:
      name: Test suite
      # -x: the log shows every step it runs, each line with the runner's timestamp.
      run: sh -x scripts/check

  web:
    name: Mac mini
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/mini.yml
    with:
      name: Web build check
      run: scripts/web --check
      timeout-minutes: 30

  # The site's smoke test (site/test.sh), for a pull request that changes the site, what it reads from outside
  # site/ (wiki/'s specs, LICENSE), the scripts that write its pins or this job. Any other
  # passes as soon as it has checked out (mini.yml's `paths`).
  site:
    name: Mac mini
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/mini.yml
    with:
      name: Site test
      paths: >-
        site wiki LICENSE scripts/bump-web-release scripts/bump-wiki-media
        .github/workflows/pr.yml .github/workflows/mini.yml .github/actions/mini-toolchain
      # wrangler keeps its config, logs and dev registry in the home directory, which the minis share with other
      # repositories' jobs: a home in the job's temp directory instead (npm's cache is the toolchain's).
      run: |
        export HOME="$RUNNER_TEMP/home"
        mkdir -p "$HOME"
        site/test.sh
      timeout-minutes: 15

  # On GitHub's machines, alongside the minis' jobs, and on every pull request: the updater is reached from
  # outside crates/update too (the app's update.rs). No secrets, so it runs for a fork's too.
  updater:
    name: Updater
    uses: ./.github/workflows/updater.yml

  # The "Protect main" ruleset requires this check by its name: keep it `pr-ok`.
  pr-ok:
    name: pr-ok
    needs: [check, web, site, updater]
    # Always runs, so a failed or cancelled job above fails this check rather than skipping it (a skipped
    # required check would count as passing).
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::pull requests from forks ($HEAD_REPO) don't run on the Mac minis; push a branch here"
            exit 1
          fi
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::a required job didn't succeed ($result)"; exit 1; }
          done
