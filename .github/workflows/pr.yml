# Every pull request, on one self-hosted Mac mini: the full suite (scripts/check, which on an Apple silicon Mac
# includes the macOS-only code's lints and tests, crates/workspace-hack's checks and the renderer's pictures), the web
# build and the wiki's committed media (if it changes what they're made from). On GitHub's machines: the site's
# smoke test (site/test.sh) if it changes the site, the updater's tests (updater.yml), and scripts/check again on
# Linux (suite.yml), which `pr-ok` doesn't wait for: a warm mini runs the suite in a few minutes, a fresh Linux
# machine in about 15 (851-3998). `pr-ok` is the one check the "Protect main" ruleset requires, so jobs can be
# added or renamed here without touching the ruleset (docs/ci.md, "Pull requests").
#
# The repository is public: this runs untrusted code from pull requests, on our own machines too. So it's
# `pull_request` (never `pull_request_target`), with a read-only token, no secrets and no environment, and
# outside contributors' runs wait for approval (the repository's Actions setting).
#
# A pull request from a fork must never run on the minis, which are persistent and shared. What stops it isn't this
# file: a pull request's run uses the workflow files from the pull request, so a fork's could drop the mini job's
# `if:` below or change its runner. The locks are outside the repository's files (docs/ci.md, "Pull requests"):
# only collaborators may open pull requests (the repository's `pull_request_creation_policy`), outside
# contributors' runs wait for approval, and the minis' job-started hook (.github/runner-hooks/job-started.sh,
# installed on each mini) fails a fork's job before it starts. The `if:` and `pr-ok`'s failure for a fork are only
# the fast, readable answer for a pull request that leaves this file alone.
name: PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # As in release.yml, for a workspace actions/checkout has to `git init` (the site job's).
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # scripts/check on one of GitHub's Linux machines (suite.yml): the port on another OS and architecture, so a
  # difference there still shows on the pull request, as its own check. `pr-ok` doesn't need it (below), so a red
  # one is fixed by hand: in the pull request if it's still open, otherwise in a ticket. main's run after each merge
  # shows it too.
  check:
    name: Linux
    uses: ./.github/workflows/suite.yml

  # The site's smoke test (site/test.sh), on one of GitHub's Linux machines, for a pull request that changes the
  # site, what it reads from outside site/ (wiki/'s specs and media, LICENSE, docs/quirks.md, whose rows the quirk
  # pages name), the script that writes its pin or this workflow; or that removes or renames a committed replay,
  # as the pages cite them and the build fails on one that's gone (851-3938). Any other passes as soon as it has
  # checked out. The inputs, but not the replays, are Workers Builds' build watch paths too (docs/web-deploy.md),
  # which site/test.sh checks.
  site:
    name: Site test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's parents too, for what it changes.
          fetch-depth: 2
      - id: changes
        env:
          PATHS: >-
            site wiki LICENSE docs/quirks.md scripts/bump-web-release .github/workflows/pr.yml
          # Only a removal or a rename here can break the build: a changed or new replay just moves a link's pin.
          CITED: >-
            fidelity/replays fidelity/settings
        run: |
          read -ra paths <<<"$PATHS"
          read -ra cited <<<"$CITED"
          if git rev-parse -q --verify HEAD^2 >/dev/null && git diff --quiet HEAD^1 HEAD -- "${paths[@]}" &&
            git diff --quiet --diff-filter=DR HEAD^1 HEAD -- "${cited[@]}"; then
            echo "nothing under $PATHS changed, and nothing under $CITED was removed or renamed: skipping"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - if: steps.changes.outputs.skip != 'true'
        run: site/test.sh

  # On a mini: the full suite (scripts/check: on an Apple silicon Mac it runs what --apple adds too, the renderer's
  # pictures among them), then the web build (scripts/web --check) and the wiki's media (docs/wiki-media.md,
  # "Checking": if the pull request changes what they're made from, wiki/media must be what it renders, byte for
  # byte; the merge commit's first parent is the base). One job, so a pull request holds one mini, whose warm
  # target dir makes the suite a few minutes.
  web:
    name: Mac mini
    # Not a fork's (the header says why this is the readable answer, not the lock).
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/mini.yml
    with:
      name: Suite, web and media
      fetch-depth: 2
      # -x: the log shows every step it runs, each line with the runner's timestamp.
      run: |
        sh -x scripts/check
        scripts/web --check
        scripts/wiki-media --check --since HEAD^1
      # The suite's builds, the web build and a render of every clip, from a cold target dir (a toolchain bump).
      timeout-minutes: 90

  # On GitHub's machines, alongside the others, and on every pull request: the updater is reached from
  # outside crates/update too (the app's update.rs). No secrets, so it runs for a fork's too.
  updater:
    name: Updater
    uses: ./.github/workflows/updater.yml

  # The "Protect main" ruleset requires this check by its name: keep it `pr-ok`.
  pr-ok:
    name: pr-ok
    # Not `check`, the Linux suite: the mini runs the same suite, warm (851-3998).
    needs: [web, site, updater]
    # Always runs, so a failed or cancelled job above fails this check rather than skipping it (a skipped
    # required check would count as passing).
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::pull requests from forks ($HEAD_REPO) don't run on the Mac minis; push a branch here"
            exit 1
          fi
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::a required job didn't succeed ($result)"; exit 1; }
          done
