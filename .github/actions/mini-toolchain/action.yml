name: Mac mini toolchain
description: >
  Sets up a job on the self-hosted Mac minis, which have no Rust or Node of their own: rustup and the toolchain
  pinned in rust-toolchain.toml (with its wasm32 targets), Node, and a cargo target dir kept between jobs.
  Everything lives in the runner's tool cache. Run cleanup.sh at the end of the job (if: always()).
runs:
  using: composite
  steps:
    # scripts/check (wasm-test) and scripts/web need Node. setup-node keeps it in the runner's tool cache, so only
    # a new version downloads.
    - uses: actions/setup-node@v7
      with:
        node-version: 24.22.1
        # No npm packages to cache: Node only runs the repo's own scripts.
        package-manager-cache: false
    - shell: bash
      run: '"$GITHUB_ACTION_PATH/setup.sh"'
