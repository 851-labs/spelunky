[package]
name = "assets"
description = "The extracted asset bundle's format: written by tools' extractor, loaded by the game"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
gmk = { workspace = true, features = ["serde"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true

# The workspace's features on Apple silicon Macs, so a build of this package alone reuses the workspace's
# (crates/workspace-hack). A dev-dependency: the shipped builds don't have it.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dev-dependencies]
workspace-hack = { path = "../workspace-hack" }
