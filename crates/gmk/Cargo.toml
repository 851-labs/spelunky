[package]
name = "gmk"
description = "Reader for GameMaker 8 .gmk project files"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
miniz_oxide = "0.9"
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

# The workspace's features on Apple silicon Macs, so a build of this package alone reuses the workspace's
# (crates/workspace-hack). A dev-dependency: the shipped builds don't have it.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dev-dependencies]
workspace-hack = { path = "../workspace-hack" }
