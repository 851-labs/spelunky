[package]
name = "gm"
description = "The subset of the GameMaker 8 runtime Spelunky Classic uses: values, RNG, instances, events, collision, rooms"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
assets.workspace = true
draw = { workspace = true, features = ["serde"] }
trace.workspace = true
# Correctly rounded sin/cos/atan/atan2 (pxfm 0.1.30, a pure-Rust CORE-MATH port) and hypot (our own, 851-3174),
# vendored and patched so x86 has no runtime CPU dispatch. Vendored, it can't change under us and desync replays
# and savestates.
pxfm = { path = "../../vendor/pxfm" }
# Savestates on disk: serde derives on the world's state, encoded with postcard like the asset bundle.
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# The collision tests use real Spelunky sprites and masks, from the reference `spelunky.gmk`.
gmk.workspace = true
# The GM8 probe tests read the probes' literals with the port's lexer, as the transpiler does.
gml.workspace = true
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
