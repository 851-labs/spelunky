[package]
name = "app"
description = "Native and web frontend: window, renderer, input, audio"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
default = ["gamepad"]
# Gamepads through gilrs (the Gamepad API on the web). Off, a session has no joystick. On Linux it needs
# libudev.
gamepad = ["dep:gilrs"]

[dependencies]
assets.workspace = true
# The device backend plays the game's sounds.
audio = { workspace = true, features = ["backend"] }
draw.workspace = true
game.workspace = true
# The settings program (`app --settings`), which can start the game.
config.workspace = true
# The game directory and highscore table, persisted between sessions (`save`).
gm.workspace = true
trace.workspace = true
bytemuck = { version = "1", features = ["derive"] }
gilrs = { version = "0.11", optional = true }
png = "0.18"
web-time = "1"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "dx12", "vulkan", "wgsl", "webgpu"] }
winit = "0.30"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ctrlc = "3"
pollster = "1"
# Updating the native apps (`app::update`); the web build updates itself.
update.workspace = true

# The menu bar's "Check for Updates…" (`app::update`). Only on macOS: elsewhere muda needs GTK, or puts a
# menu bar on the window, which takes the Alt key from the game.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
# The alert a fatal error shows in when stderr goes nowhere (`app::fatal`): muda's AppKit bindings, so
# nothing new to build.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

# The message box for it on Windows (`app::fatal`): the bindings ctrlc already uses, with MessageBoxW.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "HtmlElement", "Location", "Response", "Storage", "UrlSearchParams", "Window", "console"] }
# WebGL2 for browsers without WebGPU (`gpu::web_instance` picks).
wgpu = { version = "30", default-features = false, features = ["webgl"] }

[dev-dependencies]
# The settings test runs the settings program and then the game on the rooms of the reference .gmk files.
gmk.workspace = true
transpile.workspace = true

[lints]
workspace = true
