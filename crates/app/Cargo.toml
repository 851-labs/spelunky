[package]
name = "app"
description = "Native and web frontend: window, renderer, input, audio"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
default = ["gamepad"]
# Gamepads through gilrs (the Gamepad API on the web). Off, a session has no joystick. On Linux it needs
# libudev.
gamepad = ["dep:gilrs"]

[dependencies]
assets.workspace = true
draw.workspace = true
trace.workspace = true
bytemuck = { version = "1", features = ["derive"] }
gilrs = { version = "0.11", optional = true }
png = "0.18"
web-time = "1"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "dx12", "vulkan", "wgsl", "webgpu"] }
winit = "0.30"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[lints]
workspace = true
