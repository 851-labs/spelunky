<!doctype html>
<!-- The browser build's page. scripts/web puts it next to app.js, app_bg.wasm and assets/. -->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- This build takes ?embed (app::window::Embed). site/build.sh looks for this: only then can the wiki's clips
     play in it, as a build from before it plays a replay from the boot, without the page's controls. -->
<meta name="spelunky-embed" content="1">
<!-- And it seeks ({ spelunky: "seek", frame }, app::window::Control::Seek): only then does site/build.sh give the
     clips' player its slider, and Restart without reloading the page. -->
<meta name="spelunky-embed-seek" content="1">
<!-- And it starts its sound at the reader's next key, click or tap where the browser held it (Safari, which every
     browser on iOS is: app::play::Play): only then does site/build.sh let phones play the clips. -->
<meta name="spelunky-embed-held-sound" content="1">
<!-- And it's from after the wiki's media had the clips cut from committed replays (fidelity/replays, 851-3572):
     only then does site/build.sh let them play, not only the scenes' clips. A build from before could play one
     unlike its video, without a fix the port made since to play it as the original does. It says nothing of
     later fixes: the media are rendered from the main branch, so a release older than a fix there can play a
     clip unlike its video too. -->
<meta name="spelunky-embed-replays" content="1">
<!-- And it reports how far its run of the frames before the clip's first has got (the playback report's lead,
     app::window::Playback::lead): only then does site/build.sh have the clips' player show it over the poster. -->
<meta name="spelunky-embed-progress" content="1">
<!-- And it reports the game's state at the clip's first frame (the playback report's `state`,
     app::window::Playback::state), which the page checks against the clip's clip.json (`state_hash`): only
     then does site/build.sh have the page check it, and show the video where this build plays the clip unlike
     it, as a release from before a fix on the main branch, which the media are rendered from, can. -->
<meta name="spelunky-embed-state" content="1">
<!-- And it runs the clip's frames through, unshown, before showing the first, and reports the game's states at
     them (the playback report's `states`, app::window::Playback::states), which the page checks against the
     clip's clip.json (`states_hash`) before the poster lifts. Its `lead` then counts the clip's frames too, up
     to the replay's length. Only then does site/build.sh have the page check them, which catches a build that
     plays the clip's own frames unlike its video from the same first state. -->
<meta name="spelunky-embed-states" content="1">
<!-- And it fills its frame (app::present::Scaling::Fill): the picture as large as it fits, not by a whole number,
     so the wiki's live clips show the game as their videos do, without the wide bars a whole number leaves
     around it (scale 1 in a 640x480 frame on a 2x screen). The page has nothing to change for it: site/build.sh
     only says when a build letterboxes. -->
<meta name="spelunky-embed-fill" content="1">
<title>Spelunky Classic (unofficial mod) - Spelunky (c) 2008, 2009 Derek Yu and Mossmouth, LLC</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 14px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  /* A short window shrinks the picture to fit (the app letterboxes it) rather than cutting it off. */
  canvas { display: block; outline: none; max-width: 100vw; max-height: 100vh; }
  /* Over the page, so the press-to-start prompt doesn't push the picture down and back. */
  #status {
    position: fixed; top: 45%; left: 50%; transform: translateX(-50%); margin: 0; text-align: center;
    width: max-content; max-width: 90vw;
  }
  #status:empty { display: none; }
  #status.error { color: #f66; white-space: pre-wrap; max-width: min(60em, 90vw); text-align: left; }
  #switch { position: fixed; top: 8px; right: 12px; color: #888; font-size: 13px; text-decoration: none; }
  #switch:hover, #switch:focus-visible { color: #ccc; text-decoration: underline; }
  #switch[hidden] { display: none; }
  /* Over the game on a device with only touch (851-3925): 1.1 has no touch controls. */
  #touch {
    position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 24px; background: #000e; text-align: center; font-size: 18px;
  }
  #touch[hidden] { display: none; }
  #touch p { max-width: 30em; margin: 8px 0; }
  #touch a, #touch button { color: #ccc; font: inherit; }
  #touch button { padding: 6px 14px; background: #333; border: 1px solid #888; }
</style>
</head>
<body>
<p id="status">Loading...</p>
<!-- The way between the game and the settings program (1.1's config.exe, ?settings), outside the canvas: the
     app shows it (app::web::show_link), with Settings between runs and Play in the settings program. Leaving
     ends what runs as the window's close button would: the game writes stats.txt, the settings program saves.
     Out of the tab order, so Enter, a game key, never follows it. Nothing for a replay, a page's clip or a
     preview, which have neither: the app never shows it without the URLs. -->
<a id="switch" tabindex="-1" hidden></a>
<!-- On a device with only touch, what the game needs, before it can't be played (851-3925): Spelunky Classic has no
     touch controls, and the port adds none (the oracle models only 1.1's input). A key or a gamepad, once seen, takes
     it away, as do a mouse or trackpad connected and Play anyway: a tablet's keyboard can be there without a fine
     pointer. The settings program (?settings) is the mouse's, so there it asks for one. Not for a replay, a page's
     clip or a preview, which take no input. "Back" is the site's front page, which a local scripts/web build hasn't
     got. -->
<div id="touch" role="dialog" aria-modal="true" aria-labelledby="touch-needs" hidden>
  <p id="touch-needs">Spelunky Classic needs a keyboard or a gamepad. It has no touch controls, and this device seems
    to have neither.</p>
  <p id="touch-how">Connect a gamepad or a keyboard to play here, or play on a computer.</p>
  <p><a href="/">Back to spelunky.ai</a> &middot; <button type="button" id="touch-anyway">Play anyway</button></p>
</div>
<script type="module">
  const query = new URLSearchParams(location.search);
  if (!["replay", "embed", "preview"].some((name) => query.has(name))) {
    const link = document.getElementById("switch");
    // Flags as the page's own query writes them, `?mute&settings` rather than `?mute=&settings=`.
    const url = (q) => {
      const search = q.toString().replace(/=(?=&|$)/g, "");
      return location.pathname + (search ? `?${search}` : "");
    };
    const play = new URLSearchParams(query);
    play.delete("settings");
    const settings = new URLSearchParams(play);
    settings.set("settings", "");
    link.dataset.play = url(play);
    link.dataset.settings = url(settings);

    // Only touch: a coarse pointer and no fine one anywhere (no mouse, no trackpad). A gamepad already connected
    // can't count: a browser lists none until one of its buttons is pressed on the page, which gamepadconnected
    // then says.
    const fine = matchMedia("(any-pointer: fine)");
    if (matchMedia("(pointer: coarse)").matches && !fine.matches) {
      const notice = document.getElementById("touch");
      const settings = query.has("settings");
      if (settings) {
        document.getElementById("touch-needs").textContent =
          "Spelunky Classic's settings program needs a mouse or a trackpad, and this device seems to have neither.";
        document.getElementById("touch-how").textContent = "Connect one to change the settings here, or use a computer.";
      }
      // Back to the game, whose keys go to its canvas: the notice took the focus.
      const hide = () => {
        notice.hidden = true;
        removeEventListener("keydown", hide, true);
        removeEventListener("gamepadconnected", hide);
        fine.removeEventListener("change", pointed);
        document.querySelector("canvas")?.focus();
      };
      const pointed = () => fine.matches && hide();
      notice.hidden = false;
      document.getElementById("touch-anyway").addEventListener("click", hide, { once: true });
      if (!settings) {
        addEventListener("keydown", hide, true);
        addEventListener("gamepadconnected", hide);
      }
      fine.addEventListener("change", pointed);
    }
  }
</script>
<script type="module">
  import init from "./app.js";
  // Errors after startup go to #status from the app itself; this catches the module failing to load.
  init().catch((e) => {
    const status = document.getElementById("status");
    status.textContent = `Can't start: ${e}`;
    status.className = "error";
  });
</script>
</body>
</html>
