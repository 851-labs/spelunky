<!doctype html>
<!-- The browser build's page. scripts/web puts it next to app.js, app_bg.wasm and assets/. -->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- This build takes ?embed (app::window::Embed). site/build.sh looks for this: only then can the wiki's clips
     play in it, as a build from before it plays a replay from the boot, without the page's controls. -->
<meta name="spelunky-embed" content="1">
<!-- And it seeks ({ spelunky: "seek", frame }, app::window::Control::Seek): only then does site/build.sh give the
     clips' player its slider, and Restart without reloading the page. -->
<meta name="spelunky-embed-seek" content="1">
<!-- And it starts its sound at the reader's next key, click or tap where the browser held it (Safari, which every
     browser on iOS is: app::play::Play): only then does site/build.sh let phones play the clips. -->
<meta name="spelunky-embed-held-sound" content="1">
<title>Spelunky Classic (unofficial mod) - Spelunky (c) 2008, 2009 Derek Yu and Mossmouth, LLC</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 14px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  /* A short window shrinks the picture to fit (the app letterboxes it) rather than cutting it off. */
  canvas { display: block; outline: none; max-width: 100vw; max-height: 100vh; }
  #status:empty { display: none; }
  #status.error { color: #f66; white-space: pre-wrap; max-width: 60em; }
</style>
</head>
<body>
<p id="status">Loading...</p>
<script type="module">
  import init from "./app.js";
  // Errors after startup go to #status from the app itself; this catches the module failing to load.
  init().catch((e) => {
    const status = document.getElementById("status");
    status.textContent = `Can't start: ${e}`;
    status.className = "error";
  });
</script>
</body>
</html>
