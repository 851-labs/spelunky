[package]
name = "game"
description = "Spelunky Classic 1.1 game logic on top of gm: headless, deterministic, cloneable"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
assets.workspace = true
audio.workspace = true
draw.workspace = true
gm.workspace = true
# The audio model's part of a savestate (`HostState`), encoded like the rest of it.
postcard = { version = "1", default-features = false, features = ["alloc"] }
trace.workspace = true

[dev-dependencies]
# The smoke test reads the rooms from the reference .gmk.
gmk.workspace = true
transpile.workspace = true
# The config test reads the shipped .cfg files from the reference game zip.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

# The workspace's features on Apple silicon Macs, so a build of this package alone reuses the workspace's
# (crates/workspace-hack). A dev-dependency: the shipped builds don't have it.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dev-dependencies]
workspace-hack = { path = "../workspace-hack" }
# As the workspace's builds have it (the app's), which the hack can't ask for a member. The tests' builds
# only: the crate's code doesn't use the device, and its own dependencies are as they were.
audio = { workspace = true, features = ["backend"] }
