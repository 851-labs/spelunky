[package]
name = "game"
description = "Spelunky Classic 1.1 game logic on top of gm: headless, deterministic, cloneable"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
assets.workspace = true
audio.workspace = true
draw.workspace = true
gm.workspace = true
# The audio model's part of a savestate (`HostState`), encoded like the rest of it.
postcard = { version = "1", default-features = false, features = ["alloc"] }
trace.workspace = true

[dev-dependencies]
# The smoke test reads the rooms from the reference .gmk.
gmk.workspace = true
transpile.workspace = true
# The config test reads the shipped .cfg files from the reference game zip.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
