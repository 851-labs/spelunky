[package]
name = "config"
description = "Spelunky Classic 1.1's settings program (config.exe) on top of gm, sharing the game's built-ins"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
# The built-ins, the `SS_*` overrides and the host state are the game's: the settings program runs on the same
# runner and DLL, so it runs as a `game::Game` of another program table.
game.workspace = true
gm.workspace = true

[dev-dependencies]
# The tests read config.gmk's rooms and sprites from the reference source zip.
gmk.workspace = true
trace.workspace = true
transpile.workspace = true

[lints]
workspace = true

# The workspace's features on Apple silicon Macs, so a build of this package alone reuses the workspace's
# (crates/workspace-hack). A dev-dependency: the shipped builds don't have it.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dev-dependencies]
workspace-hack = { path = "../workspace-hack" }
# As the workspace's builds have it (the app's), which the hack can't ask for a member. The tests' builds
# only: the crate's code doesn't use the device, and its own dependencies are as they were.
audio = { workspace = true, features = ["backend"] }
