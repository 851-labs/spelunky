[package]
name = "trace"
description = "Replay (inputs per tick) and trace (state per tick) formats shared by the port and the reference oracle"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: without it serde_json may parse a float 1 ULP off, and traces must be lossless.
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints]
workspace = true
