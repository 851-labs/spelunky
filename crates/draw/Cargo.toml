[package]
name = "draw"
description = "Renderer-agnostic draw lists: what the game emits each tick and the app renders"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
# Savestates (gm) serialize the drawing state that carries across steps.
serde = { version = "1", features = ["derive"], optional = true }

[lints]
workspace = true

# The workspace's features on Apple silicon Macs, so a build of this package alone reuses the workspace's
# (crates/workspace-hack). A dev-dependency: the shipped builds don't have it.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dev-dependencies]
workspace-hack = { path = "../workspace-hack" }
