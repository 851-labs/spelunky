[package]
name = "transpile"
description = "The GML-to-Rust transpiler that generates the game crate's code from spelunky.gmk"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
# `reference::stub_assets`, for tests that run a program without extracted assets.
assets.workspace = true
gm.workspace = true
gmk.workspace = true
gml.workspace = true
# Reads spelunky.gmk straight from the reference zip.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

# The examples carry unit tests (`scripts/cargo test` runs them).
[[example]]
name = "analyze"
test = true

# The workspace's features on Apple silicon Macs, so a build of this package alone reuses the workspace's
# (crates/workspace-hack). A dev-dependency: the shipped builds don't have it.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dev-dependencies]
workspace-hack = { path = "../workspace-hack" }
