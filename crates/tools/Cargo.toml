[package]
name = "tools"
description = "Asset extractor, wiki sprite, room picture, stat and relation exporters, wiki citation checker, app icon maker, GML transpiler driver, and trace diff"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
assets.workspace = true
gmk.workspace = true
# wiki-sprites reads the objects' GML for the sprites they use and their animation speeds; wiki-data for
# the game's numbers.
gml.workspace = true
# wiki-data: which variables are built-ins.
gm.workspace = true
png = "0.18"
# wiki-sprites' and wiki-data's metadata, and wiki-data's specs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
trace.workspace = true
transpile.workspace = true
# trace-diff reads the oracle's gzipped traces directly. Same backend as zip, so only one is built.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[lints]
workspace = true

# The workspace's features on Apple silicon Macs, so a build of this package alone reuses the workspace's
# (crates/workspace-hack).
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
workspace-hack = { path = "../workspace-hack" }
# On CI's x86_64 Linux, for its builds of some packages (scripts/check's per-crate steps): the tests' and lints'
# only, so the release binaries the soak and the releases build there (harness's fidelity, tools' extract) don't
# link what the hack brings (kira's cpal, ALSA), as they didn't before.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dev-dependencies]
workspace-hack = { path = "../workspace-hack" }
