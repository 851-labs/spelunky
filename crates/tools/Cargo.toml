[package]
name = "tools"
description = "Asset extractor, wiki sprite exporter, app icon maker, GML transpiler driver, headless replay runner, and trace diff"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
assets.workspace = true
gmk.workspace = true
# wiki-sprites reads the objects' GML for the sprites they use and their animation speeds.
gml.workspace = true
png = "0.18"
# wiki-sprites' metadata.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
trace.workspace = true
transpile.workspace = true
# trace-diff reads the oracle's gzipped traces directly. Same backend as zip, so only one is built.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[lints]
workspace = true
