[package]
name = "tools"
description = "Asset extractor, wiki sprite, room picture, stat and relation exporters, wiki citation checker, app icon maker, GML transpiler driver, headless replay runner, and trace diff"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
assets.workspace = true
gmk.workspace = true
# wiki-sprites reads the objects' GML for the sprites they use and their animation speeds; wiki-data for
# the game's numbers.
gml.workspace = true
# wiki-data: which variables are built-ins.
gm.workspace = true
png = "0.18"
# wiki-sprites' and wiki-data's metadata, and wiki-data's specs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
trace.workspace = true
transpile.workspace = true
# trace-diff reads the oracle's gzipped traces directly. Same backend as zip, so only one is built.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[lints]
workspace = true
