# The wiki's planned pages: those not written yet that a page may link to, as red links (docs/wiki-style.md,
# "Red links"). A link to a slug that's neither a page, nor here, nor one of wiki-data's (its entities',
# areas', special levels' and shops' slugs, which are their pages') fails the build, so a typo can't become a
# red link for good. Add a page here when you link it before it's written, and remove it in the PR that
# writes it (the build fails on a planned slug that has a page).
#
#   <slug>: { title: <its title>, type: <its page type>, objects: [...], rooms: [...], card: { sprite: ..., frame: ... } }
#
# All but the title are optional. `type` is checked against the relations that point at it (a found_in at a
# place), and `objects` and `rooms` are the ones the page will have, as far as a plain relation to it needs
# them to be checked against relations.json (the Snake's `damaged_by: [spikes]`, `found_in: [tutorial]`).
# `card` is its card's sprite on the hubs (docs/wiki-style.md, "Infobox values"), where it has no object or
# its object's sprite reads badly; once the page is written, its infobox image says.

credits: { title: Credits }
fish-bone: { title: Fish Bone, type: item, objects: [oFishBone] }
kali: { title: Kali, type: character, card: { sprite: sKaliHead1 } }
kalis-altar: { title: Kali's Altar, objects: [oSacAltarLeft, oSacAltarRight] }
kalis-favour: { title: Kali's favour, type: mechanic, card: { sprite: sKaliHead1 } }
level-editor: { title: Level editor }
settings: { title: Settings }
spelunker: { title: Spelunker, type: character, objects: [oPlayer1], card: { sprite: sRunLeft } }
tutorial: { title: Tutorial, type: place, rooms: [rTutorial], card: { sprite: sTutorialSign } }
