# The wiki's planned pages: those not written yet that a page may link to, as red links (docs/wiki-style.md,
# "Red links"), and the rest of the wiki's scope, which the hubs list dimmed as pages to come ("Hubs"). A
# link to a slug that's neither a page, nor here, nor one of wiki-data's (its entities', areas', special
# levels' and shops' slugs, which are their pages') fails the build, so a typo can't become a red link for
# good. Add a page here when you link it before it's written, or when a content ticket plans it, and remove it
# in the PR that writes it (the build fails on a planned slug that has a page).
#
#   <slug>: { title: <its title>, type: <its page type>, category: <its hub>, objects: [...], rooms: [...], card: { sprite: ..., frame: ... }, related: [...], lede: "..." }
#
# All but the title are optional. `type` is checked against the relations that point at it (a found_in at a
# place), and `objects` and `rooms` are the ones the page will have, as far as a plain relation to it needs
# them to be checked against relations.json (the Snake's `damaged_by: [spikes]`, `found_in: [tutorial]`).
# The page is on its type's hub, or its `category`'s where that isn't the one (a mechanic page about the game
# itself is the-game's); one with neither is only a red link, and the build fails on it once nothing links it.
# `card` is its card's sprite on the hubs (docs/wiki-style.md, "Infobox values"), where it has no object or
# its object's sprite reads badly; once the page is written, its infobox image says. A planned quirk has a
# `related` and a `lede` (and nothing else has), which its card on /wiki/quirks shows as a written quirk's: the
# pages it involves, checked as its page's `related` will be, which the hub filters by, and a one-sentence
# lede, plain text, from its docs/quirks.md row (docs/wiki-style.md, "Red links"). The page takes both over.
# Each is on one line.

fish-bone: { title: Fish Bone, type: item, objects: [oFishBone] }
shortcut-win-no-time: { title: The shortcut win's 0:00, type: quirk, card: { sprite: sTimerIcon }, related: [scoring, tunnel-man-shortcuts, speedrunning-basics], lede: "The shortcut win's 0:00 is a quirk of Spelunky Classic in which a player whose wins all came from a shortcut door sees TIME: 0:00 in the high scores." }
spectacles-message: { title: A Spectacles for sale, type: quirk, card: { sprite: sSpectacles }, related: [spectacles, spike-shoes, jetpack, rope-pile, shopkeeper], lede: "A Spectacles for sale is a quirk of Spelunky Classic in which four wares' price messages change their wording past level 2, as A SPECTACLES FOR $8800." }
stolen-ware-unequipped: { title: The stolen ware left unequipped, type: quirk, card: { sprite: sSpikeShoes }, related: [shopkeeper, spike-shoes, rare-shop, clothing-shop], lede: "The stolen ware left unequipped is a quirk of Spelunky Classic in which a ware carried out of a shop ahead of the player stays in his hands unworn." }
stomping-while-jumping: { title: Stomping while jumping, type: quirk, card: { sprite: sBatLeft }, related: [stomping, bat, spider], lede: "Stomping while jumping is a quirk of Spelunky Classic in which jumping up into a monster from just below kills it as a stomp would." }
tutorial: { title: Tutorial, type: place, rooms: [rTutorial], card: { sprite: sTutorialSign } }
