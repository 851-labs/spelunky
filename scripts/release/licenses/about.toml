# cargo-about's settings for the Rust crates' notices that every release ships (scripts/third-party-licenses,
# docs/releasing.md "Third-party licenses"): the targets the releases and the web build are built for, only what's
# linked into the app (no build or dev dependencies, nor our own unpublished crates), and the licenses we accept.
# A crate under any other fails the generation, so a new license is a decision, not an accident.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-gnullvm",
  "aarch64-pc-windows-gnullvm",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "wasm32-unknown-unknown",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "0BSD",
  "Unlicense",
  "CC0-1.0",
  "OFL-1.1",
]
workarounds = ["ring", "rustls", "wasm-bindgen"]
