[[entity.stat]]
id = "value-jungle"
label = "Value in the Jungle"
unit = "$"
find = "value = ?"
where = ["global.levelType == 1"]
matches = 1

[[entity.stat]]
id = "value-temple"
label = "Value in the Temple"
unit = "$"
find = "value = ?"
where = ["global.levelType == 3"]
matches = 1

[[entity.stat]]
id = "dart-speed"
label = "Darting speed"
unit = "px/step"
event = "step"
find = "xVel = ? * cos(degtorad(dir))"
note = "As each dart starts; it slows by 0.5 a step, to a stop."

[[entity.stat]]
id = "flee-range"
label = "Flee range"
unit = "px"
event = "step"
find = "dist < ?"
note = "Closer to the player than this, it darts away from him; otherwise in a random direction."

[[entity]]
slug = "hawkman"
name = "Hawkman"
kind = "monster"
object = "oHawkman"

[[entity.stat]]
id = "hp"
label = "Health"
unit = "hit points"
find = "hp = ?"

[[entity.stat]]
id = "damage"
label = "Contact damage"
unit = "hearts"
event = "collision_oCharacter"
find = "global.plife -= ?"
note = "Hearts lost on touching it with a block right above it; in the open, it throws the player instead."

[[entity.stat]]
id = "stomp-damage"
label = "Stomp damage"
unit = "hit points"
event = "collision_oCharacter"
find = "hp -= ?"
note = "Damage a stomp deals: 1, plus 1 for every 16 steps the player has been falling; three times that with Spike Shoes."

[[entity.stat]]
id = "walk-speed"
label = "Walking speed"
unit = "px/step"
event = "step"
find = "xVel = -?"
where = ["status == WALK"]
matches = 1

[[entity.stat]]
id = "charge-speed"
label = "Charging speed"
unit = "px/step"
event = "step"
find = "xVel = -?"
where = ["status == ATTACK"]
matches = 1

[[entity.stat]]
id = "throw-speed"
label = "Throw speed"
unit = "px/step"
event = "collision_oCharacter"
find = "other.xVel = -?"
where = ["status != THROW"]
matches = 1
note = "How fast the player flies off sideways when it throws him (and 6 upward)."

[[entity.stat]]
id = "throw-damage"
label = "Damage from a throw"
unit = "hearts"
object = "oPlayer1"
event = "step"
find = "global.plife -= ?"
where = ["wallHurt > 0"]
note = "Hearts lost to the first wall or floor the player hits after a Hawkman throws him, unless the fall is long enough to hurt him instead."

[[entity.stat]]
id = "stun-time"
label = "Stun time"
unit = "steps"
find = "stunTime = ?"
note = "Counted down only on the steps it's on the ground or held."

[[entity.stat]]
id = "favor"
label = "Kali favor when sacrificed"
find = "favor = ?"

[[entity]]
slug = "ghost"
name = "Ghost"
kind = "monster"
object = "oGhost"

[[entity.stat]]
id = "speed"
label = "Speed"
unit = "px/step"
event = "step"
find = "x += ? * cos(degtorad(dir))"
note = "Straight toward the player, through walls."

# The graveyard level's monsters (851-3410). The Zombie and the Dead Fish keep oEnemy's touch; the
# Vampire has its own, with the same patterns, so all three take the template.
[[entity]]
slug = "zombie"
name = "Zombie"
kind = "monster"
object = "oZombie"
templates = ["monster"]

[[entity.stat]]
id = "hp"
label = "Health"
unit = "hit points"
find = "hp = ?"

[[entity.stat]]
id = "hop-speed"
label = "Long hop speed"
unit = "px/step"
event = "step"
find = "xVel = -?"
where = ["status == BOUNCE", "rand(1, 4) == 1"]
matches = 1
note = "Across, toward the player, on the 1 in 4 hops that are long ones; the others go 1 px/step. It keeps the speed until it lands."

[[entity.stat]]
id = "wake-range"
label = "Wake range"
unit = "px"
event = "step"
find = "dist < ?"
where = ["status == IDLE"]
nth = 0
matches = 2
note = "It hops at the player within this distance once its rest is over, and within 48 px whether it is or not; never while he's swimming."

[[entity.stat]]
id = "rest"
label = "Rest after a hop"
unit = "steps"
event = "step"
find = "counter = ?"
where = ["status == RECOVER"]
matches = 1

[[entity]]
slug = "vampire"
name = "Vampire"
kind = "monster"
object = "oVampire"
templates = ["monster"]

[[entity.stat]]
id = "hp"
label = "Health"
unit = "hit points"
find = "hp = ?"

[[entity.stat]]
id = "walk-speed"
label = "Walking speed"
unit = "px/step"
event = "step"
find = "xVel = -?"
where = ["status == WALK"]
matches = 1

[[entity.stat]]
id = "charge-speed"
label = "Charging speed"
unit = "px/step"
event = "step"
find = "xVel = -?"
where = ["status == ATTACK"]
matches = 1

[[entity.stat]]
id = "flight-speed"
label = "Flight speed"
unit = "px/step"
event = "step"
find = "xVel = ? * cos(degtorad(dir))"
where = ["dist < 160"]
matches = 1
note = "As a bat, toward the player, as the code sets it."

[[entity.stat]]
id = "sight-range"
label = "Sight range"
unit = "px"
event = "step"
find = "dist < ?"
where = ["status == IDLE"]
matches = 1
note = "Standing or walking, it charges once the player is this close."

[[entity.stat]]
id = "chase-range"
label = "Chase range"
unit = "px"
event = "step"
find = "dist < ?"
where = ["status == FLY"]
matches = 1
note = "As a bat, it flies at the player while within this distance; beyond it, it flies up to a ceiling and hangs."

[[entity.stat]]
id = "stun-time"
label = "Stun time"
unit = "steps"
find = "stunTime = ?"

[[entity.stat]]
id = "favor"
label = "Kali favor when sacrificed"
find = "favor = ?"

[[entity]]
slug = "dead-fish"
name = "Dead Fish"
kind = "monster"
object = "oDeadFish"
templates = ["monster"]

[[entity.stat]]
id = "hp"
label = "Health"
unit = "hit points"
find = "hp = ?"

[[entity.stat]]
id = "attack-speed"
label = "Attacking speed"
unit = "px/step"
event = "step"
find = "moveTo(? * cos(degtorad(dir)), ?)"
note = "Toward the player, as the code sets it; the game moves it a whole pixel on each axis, so about 1.4 px/step on a diagonal."

[[entity.stat]]
id = "attack-range"
label = "Attack range"
unit = "px"
event = "step"
find = "dist < ?"
where = ["status == IDLE"]
matches = 1
note = "It swims at the player while he's swimming within this distance of it."
