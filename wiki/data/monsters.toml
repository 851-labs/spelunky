[[entity.stat]]
id = "wake-range"
label = "Wake range"
unit = "px"
event = "step"
find = "dist < ?"
where = ["status == HANG"]
matches = 1
note = "It drops from its perch when the player is this close and below it (or when the block it hangs from is gone)."

[[entity.stat]]
id = "chase-range"
