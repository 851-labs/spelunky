# The Mines monsters' numbers, for the wiki's infoboxes (docs/wiki-data.md). Each stat is a GML pattern,
# `?` standing for any expression, looked for in an object's event (`create` unless `event` says) or a
# script; `scripts/wiki-data` reports every match with its value, conditions, file and line.

# What every monster that keeps oEnemy's touch code shares (Caveman and Giant Spider have their own,
# with the same patterns).
[[template.monster]]
id = "damage"
label = "Contact damage"
unit = "hearts"
event = "collision_oCharacter"
find = "global.plife -= ?"
note = "Hearts lost on touching it, unless the player is invincible (for 30 steps after a hit) or stomping it."

[[template.monster]]
id = "stomp-damage"
label = "Stomp damage"
unit = "hit points"
event = "collision_oCharacter"
find = "hp -= ?"
note = "Damage a stomp deals: 1, plus 1 for every 16 steps the player has been falling; three times that with Spike Shoes."

[[entity]]
slug = "snake"
name = "Snake"
kind = "monster"
object = "oSnake"
templates = ["monster"]

[[entity.stat]]
id = "hp"
label = "Health"
unit = "hit points"
find = "hp = ?"

[[entity.stat]]
id = "walk-speed"
label = "Walking speed"
unit = "px/step"
event = "step"
find = "xVel = -?"
where = ["status == WALK"]
matches = 1

[[entity.stat]]
id = "pause"
label = "Pause length"
unit = "steps"
event = "step"
find = "counter = ?"
where = ["rand(1, 100) == 1"]
note = "How long it stops for when it pauses while walking."

[[entity.stat]]
id = "pause-chance"
label = "Chance to pause"
unit = "1 in N per step"
event = "step"
find = "rand(1, ?) == 1"
where = ["status == WALK"]

[[entity]]
slug = "bat"
name = "Bat"
kind = "monster"
object = "oBat"
templates = ["monster"]

[[entity.stat]]
id = "hp"
label = "Health"
unit = "hit points"
find = "hp = ?"

[[entity.stat]]
id = "wake-range"
label = "Wake range"
unit = "px"
event = "step"
find = "dist < ?"
where = ["status == HANG"]
matches = 1
note = "It drops from its perch when the player is this close and below it (or when the block it hangs from is gone)."

[[entity.stat]]
id = "chase-range"
label = "Chase range"
unit = "px"
event = "step"
find = "dist < ?"
where = ["!oPlayer1.dead"]
matches = 1
note = "It flies at the player while within this distance; beyond it, it flies up to a ceiling and hangs again."

[[entity.stat]]
id = "flight-speed"
label = "Flight speed"
unit = "px/step"
event = "step"
find = "xVel = ? * cos(degtorad(dir))"

