[[entity.stat]]
id = "drop-range"
label = "Drop range"
unit = "px"
object = "oSpiderHang"
event = "step"
find = "dist < ?"
note = "It drops when the player is this close, below it and within 8 px of its middle (or when its ceiling is gone)."

[[entity.stat]]
id = "jump-range"
label = "Jump range"
unit = "px"
event = "step"
find = "dist < ?"
note = "Within this distance it hops at the player again each time it lands, unless a 1 in 4 roll makes it pause; beyond it, it makes one hop toward the player after each pause."

[[entity.stat]]
