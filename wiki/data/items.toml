# Carryables: things the player picks up (down + attack) and throws. A thrown one hurts a monster while it
# moves faster than 2 px a step: oItem's step for most, the Jar's and the Skull's own steps for them.
[[template.thrown]]
id = "damage"
label = "Thrown damage to monsters"
unit = "hit points"
event = "step"
find = "hp -= ?"
where = ["oEnemy"]
note = "To the monster nearest it, while it moves faster than 2 px a step; some monsters' own rules change it."

