unit = "px/step, plus the player's"
script = "scrUseItem"
find = "obj.xVel = ? + xVel"
where = ["holdItem.type == \"Shotgun\"", "facing == RIGHT"]
note = "Firing right; firing left is the same to the left. At least 6."

[[entity.stat]]
id = "damage"
label = "Damage per pellet"
unit = "hit points"
object = "oBullet"
event = "collision_oEnemy"
find = "hp -= ?"

[[entity.stat]]
