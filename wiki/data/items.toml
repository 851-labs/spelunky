# Items' and weapons' numbers, and shop prices (docs/wiki-data.md).

# What a shop sells it for. scrShopItemsGen raises an item's price past level 2 (`global.currLevel`, 1 to
# 16: the Mines are 1-4, the Jungle 5-8, the Ice Caves 9-12, the Temple 13-16).
[[template.shop-item]]
id = "price"
label = "Price"
unit = "$"
find = "cost = ?"
note = "The base price; shops past level 2 charge more (price-by-level)."

[[template.shop-item]]
id = "price-by-level"
label = "Price by level"
unit = "$"
script = "scrShopItemsGen"
find = "cost += ?"
table = { var = "global.currLevel", from = 1, to = 16, bind = { cost = "price" } }
note = "10% of the base price more for each level past the second."

