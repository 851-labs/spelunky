# Mechanics' numbers (docs/wiki-data.md): how the player's hearts, damage, stomps and throws work, his bombs
# and ropes, Kali's favour and sacrifices, the ghost timer, level generation's odds and the Tunnel Man's
# donations. A mechanic is no one object, so the entities name none, and each stat says where it's read:
# mostly oPlayer1's step, which checks for most of what hurts him in turn, and the code most monsters share,
# oEnemy's. That code is read through the Snake, which runs it: a stat that names oEnemy makes relations.json
# walk its events for drops too (traps.toml), and the facts' lines are oEnemy's either way. Nor can a stat
# name Kali's altar (oSacAltarLeft), whose drops are her gifts already (relations.toml's given_by), so the
# pages cite what a defiled altar costs. Kali's favour has no entity: its gifts' and devouring's marks are
# Kali's own (characters.toml), which her page shows too. The Tunnel Man shortcuts' entity has no prices: they
# are the Tunnel Man's stats (characters.toml), which both pages show.

[[entity]]
slug = "health"
name = "Health"
kind = "mechanic"

[[entity.stat]]
id = "start"
label = "Hearts at the start of a game"
unit = "hearts"
script = "scrClearGlobals"
find = "global.plife = ?"
matches = 2
nth = 1
note = "The Tunnel Man starts with fewer."

[[entity.stat]]
id = "tunnel-man-start"
label = "The Tunnel Man's hearts at the start of a game"
unit = "hearts"
script = "scrClearGlobals"
find = "global.plife = ?"
where = ["global.isTunnelMan"]

[[entity.stat]]
id = "max"
label = "Most hearts"
unit = "hearts"
object = "oPlayer1"
event = "step"
find = "global.plife = ?"
where = ["global.plife > 99"]
note = "More is cut back to this at the start of each of the player's steps."

[[entity.stat]]
id = "damsel-heal"
label = "Hearts from a rescued Damsel"
unit = "hearts"
object = "oDamselKiss"
event = "other_room_end"
find = "global.plife += ?"
note = "Given once the screen between levels ends, after a level the player rescued a Damsel on."

[[entity.stat]]
id = "kiss-heal"
label = "Hearts from a kiss bought in the Kissing Parlor"
unit = "hearts"
object = "oPlayer1"
event = "step"
find = "global.plife += ?"

[[entity.stat]]
id = "kali-heal"
label = "Hearts from Kali"
unit = "hearts"
script = "scrGetFavorMsg"
find = "global.plife += ?"
matches = 2

[[entity.stat]]
id = "bonus-room"
label = "Hearts in the bonus rooms"
unit = "hearts"
object = "oSunRoom"
find = "global.plife = ?"
note = "The Moon and Stars rooms set the same."

[[entity]]
slug = "damage"
name = "Damage and stun"
kind = "mechanic"

[[entity.stat]]
id = "invincibility"
label = "Invincibility after a monster's touch"
unit = "steps"
object = "oSnake"
event = "collision_oCharacter"
find = "other.invincible = ?"
note = "The player blinks while it lasts, and no monster's touch hurts him."

[[entity.stat]]
id = "knockback"
label = "Knockback from a monster's touch"
unit = "px/step"
object = "oSnake"
event = "collision_oCharacter"
find = "other.xVel = ?"
matches = 2
nth = 1
note = "Away from the monster."

[[entity.stat]]
id = "long-drop-stun"
label = "Stun after a long drop"
unit = "steps"
object = "oPlayer1"
event = "step"
find = "stunTimer += ?"

[[entity.stat]]
id = "arrow-stun"
label = "Stun after an arrow"
unit = "steps"
object = "oPlayer1"
event = "step"
find = "stunTimer = ?"
where = ["oArrow"]

[[entity.stat]]
id = "explosion-stun"
label = "Stun after an explosion"
unit = "steps"
object = "oPlayer1"
event = "step"
find = "stunTimer = ?"
where = ["oExplosion"]

[[entity]]
slug = "stomping"
name = "Stomping"
kind = "mechanic"

[[entity.stat]]
id = "bounce"
label = "Bounce off a stomp"
unit = "px/step"
object = "oSnake"
event = "collision_oCharacter"
find = "other.yVel = -? - 0.2 * other.yVel"
note = "Upward, plus a fifth of the speed the player was falling at."

[[entity]]
slug = "throwing"
name = "Throwing"
kind = "mechanic"

[[entity.stat]]
id = "speed"
label = "Throwing speed"
unit = "px/step"
script = "scrUseItem"
find = "holdItem.xVel = ? + xVel"
matches = 36
nth = 35
note = "Forward, plus the player's own speed. What scrUseItem's last branch gives an item that isn't a weapon, the Bomb or the Rope."

[[entity.stat]]
id = "heavy-speed"
label = "Throwing speed of a heavy item"
unit = "px/step"
script = "scrUseItem"
find = "holdItem.xVel = ? + xVel"
matches = 36
nth = 34

[[entity.stat]]
id = "lift"
label = "Upward speed of a throw"
unit = "px/step"
script = "scrUseItem"
find = "holdItem.yVel = -?"
nth = 2
note = "Of an item that isn't heavy."

[[entity.stat]]
id = "up-lift"
label = "Upward speed of a throw with up held"
unit = "px/step"
script = "scrUseItem"
find = "holdItem.yVel = -?"
nth = 4
note = "Of an item that isn't heavy."

[[entity.stat]]
id = "safe"
label = "Steps a thrown item can't hurt the player"
unit = "steps"
script = "scrUseItem"
find = "holdItem.alarm[2] = ?"
matches = 9

[[entity]]
slug = "scoring"
name = "Scoring"
kind = "mechanic"
object = "oHighscores"

[[entity.stat]]
id = "money-bronze"
label = "Best money for a bronze trophy"
unit = "$"
find = "tMoney >= ?"
matches = 3
nth = 0

[[entity.stat]]
id = "money-silver"
label = "Best money for a silver trophy"
unit = "$"
find = "tMoney >= ?"
matches = 3
nth = 2

[[entity.stat]]
id = "money-gold"
label = "Best money for a gold trophy"
unit = "$"
find = "tMoney >= ?"
matches = 3
nth = 1
note = "It also opens the Sun Room's door."

[[entity.stat]]
id = "time-bronze"
label = "Best time for a bronze trophy: under this many seconds"
find = "tTime < ?"
note = "Seconds on the game's clock, which counts a second every 33 1/3 steps. A time of exactly 960 gets none, though the bronze check inside is <= 960."

[[entity.stat]]
id = "time-silver"
label = "Best time for a silver trophy: at most this many seconds"
find = "tTime <= ?"
matches = 3
nth = 1

[[entity.stat]]
id = "time-gold"
label = "Best time for a gold trophy: at most this many seconds"
find = "tTime <= ?"
matches = 3
nth = 2
note = "It also opens the Moon Room's door."

[[entity.stat]]
id = "kills-bronze"
label = "Most kills for a bronze trophy"
find = "tKills >= ?"
matches = 3
nth = 0

[[entity.stat]]
id = "kills-silver"
label = "Most kills for a silver trophy"
find = "tKills >= ?"
matches = 3
nth = 2

[[entity.stat]]
id = "kills-gold"
label = "Most kills for a gold trophy"
find = "tKills >= ?"
matches = 3
nth = 1
note = "It also opens the Stars Room's door."

[[entity.stat]]
id = "saves-bronze"
label = "Most saves for a bronze trophy"
find = "tSaves >= ?"
matches = 3
nth = 0

[[entity.stat]]
id = "saves-silver"
label = "Most saves for a silver trophy"
find = "tSaves >= ?"
matches = 3
nth = 2

[[entity.stat]]
id = "saves-gold"
label = "Most saves for a gold trophy"
find = "tSaves >= ?"
matches = 3
nth = 1
note = "It also opens the Changing Room's door."

[[entity]]
slug = "endings"
name = "Endings"
kind = "mechanic"
object = "oEnd3"

[[entity.stat]]
id = "bonus"
label = "The treasure's bonus on the final score"
unit = "$"
event = "alarm_11"
find = "global.money += ?"
note = "The custom levels' end (oEndCustom) adds the same."

[[entity]]
slug = "bombs-and-ropes"
name = "Bombs and ropes"
kind = "mechanic"

[[entity.stat]]
id = "tunnel-man-bombs"
label = "The Tunnel Man's bombs at the start of a game"
unit = "bombs"
script = "scrClearGlobals"
find = "global.bombs = ?"
where = ["global.isTunnelMan"]

[[entity.stat]]
id = "tunnel-man-ropes"
label = "The Tunnel Man's ropes at the start of a game"
unit = "ropes"
script = "scrClearGlobals"
find = "global.rope = ?"
where = ["global.isTunnelMan"]

[[entity.stat]]
id = "kali-bombs"
label = "Bombs after Kali's third gift"
unit = "bombs"
script = "scrGetFavorMsg"
find = "global.bombs = ?"

[[entity.stat]]
id = "kali-bombs-below"
label = "Bombs from which Kali's third gift is hearts"
unit = "bombs"
script = "scrGetFavorMsg"
find = "global.bombs < ?"
note = "With fewer, she sets the bombs to 99."

[[entity]]
slug = "sacrifice"
name = "Sacrifice"
kind = "mechanic"

[[entity.stat]]
id = "wait"
label = "Steps a body lies still on the altar before it burns"
unit = "steps"
object = "oSnake"
find = "sacCount = ?"
note = "Counted again from the start whenever it moves or is picked up."

[[entity]]
slug = "ghost-timer"
name = "Ghost timer"
kind = "mechanic"

[[entity.stat]]
id = "warning"
label = "The level's clock at the warning"
object = "oGame"
event = "step"
find = "global.xtime > ?"
matches = 2
nth = 0
note = "The clock gains 30 a step, so this is 4,000 steps into the level."

[[entity.stat]]
id = "ghost"
label = "The level's clock when the Ghost comes"
object = "oGame"
event = "step"
find = "global.xtime > ?"
matches = 2
nth = 1
note = "5,000 steps into the level."

[[entity]]
slug = "level-generation"
name = "Level generation"
kind = "mechanic"

[[entity.stat]]
id = "dark-level"
label = "Odds of a dark level"
unit = "1 in"
script = "scrClearGlobals"
find = "global.probDarkLevel = ?"
note = "Rolled for each level from level 2 outside the Ice Caves and Olmec's Lair, until the area has had one."

[[entity.stat]]
id = "snake-pit"
label = "Odds of a snake pit"
unit = "1 in"
script = "scrClearGlobals"
find = "global.probSnakePit = ?"
note = "For each column of three side rooms on a Mines level, until one is made."

[[entity.stat]]
id = "graveyard"
label = "Odds of a graveyard level"
unit = "1 in"
script = "scrClearGlobals"
find = "global.probCemetary = ?"
note = "For each Jungle level."

[[entity.stat]]
id = "flooded"
label = "Odds of a flooded level"
unit = "1 in"
script = "scrClearGlobals"
find = "global.probLake = ?"
note = "For each Jungle level reached through the screen between levels, until the Black Market's door is taken."

[[entity.stat]]
id = "mothership"
label = "Odds of a mothership"
unit = "1 in"
script = "scrClearGlobals"
find = "global.probAlien = ?"
note = "For each Ice Caves level after the Moai's."

[[entity.stat]]
id = "yeti-lair"
label = "Odds of a Yeti lair"
unit = "1 in"
script = "scrClearGlobals"
find = "global.probYetiLair = ?"
note = "For each Ice Caves level after the Moai's whose mothership roll fails."

[[entity.stat]]
id = "sacrifice-pit"
label = "Odds of a sacrifice pit"
unit = "1 in"
script = "scrClearGlobals"
find = "global.probSacPit = ?"
note = "For each Temple level."

[[entity]]
slug = "tunnel-man-shortcuts"
name = "Tunnel Man shortcuts"
kind = "mechanic"

[[entity.stat]]
id = "press"
label = "A donation's change for a press of up or down"
unit = "$"
object = "oTransition"
event = "step"
find = "person.donate += ?"

[[entity.stat]]
id = "hold-delay"
label = "Steps up or down is held before the donation changes by itself"
unit = "steps"
object = "oTunnelMan"
event = "step"
find = "upCounter < ?"

[[entity.stat]]
id = "hold-step"
label = "A donation's change a step while up or down is held"
unit = "$"
object = "oTunnelMan"
event = "step"
find = "donate += ?"
matches = 2
nth = 1

[[entity.stat]]
id = "fast-after"
label = "Steps up or down is held before the donation changes faster"
unit = "steps"
object = "oTunnelMan"
event = "step"
find = "upHeld > ?"

[[entity.stat]]
id = "fast-step"
label = "A donation's change a step once up or down has been held longer"
unit = "$"
object = "oTunnelMan"
event = "step"
find = "donate += ?"
matches = 2
nth = 0
