# Treasure values (docs/wiki-data.md). A treasure is worth more in deeper areas (`global.levelType`: 0 the
# Mines, 1 the Jungle, 2 the Ice Caves, 3 the Temple).

# Gold and gems the player picks up by touching them (oPlayer1's step event).
[[template.treasure]]
id = "value"
label = "Base value"
unit = "$"
find = "value = ?"

[[template.treasure]]
id = "value-by-area"
label = "Value by area"
unit = "$"
object = "oPlayer1"
event = "step"
find = "global.collect += ?"
where = ["gem.canCollect"]
table = { var = "global.levelType", from = 0, to = 3, labels = ["Mines", "Jungle", "Ice Caves", "Temple"], bind = { "gem.value" = "value", "global.collect" = 0 } }

# Idols, worth their value once carried out of the level.
[[template.idol]]
id = "value"
label = "Base value"
unit = "$"
find = "value = ?"

[[template.idol]]
id = "value-by-area"
label = "Value by area"
unit = "$"
object = "oPlayer1"
event = "step"
find = "global.collect += holdItem.value * ?"
table = { var = "global.levelType", from = 0, to = 3, labels = ["Mines", "Jungle", "Ice Caves", "Temple"], bind = { "holdItem.value" = "value", "global.collect" = 0 } }
note = "Paid when the player carries it through the exit."

