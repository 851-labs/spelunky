# Treasure values (docs/wiki-data.md). A treasure is worth more in deeper areas (`global.levelType`: 0 the
# Mines, 1 the Jungle, 2 the Ice Caves, 3 the Temple, 4 Olmec's Lair, level 16, scrInitLevel).

# Gold and gems the player picks up by touching them (oPlayer1's step event).
[[template.treasure]]
id = "value"
label = "Base value"
unit = "$"
find = "value = ?"

[[template.treasure]]
id = "value-by-area"
label = "Value by area"
unit = "$"
object = "oPlayer1"
event = "step"
find = "global.collect += ?"
where = ["gem.canCollect"]
table = { var = "global.levelType", from = 0, to = 4, labels = ["Mines", "Jungle", "Ice Caves", "Temple", "Olmec's Lair"], bind = { "gem.value" = "value", "global.collect" = 0 } }

# Gems can't be collected until their alarm, which sets canCollect, has run (oTreasure's create sets it false).
[[template.gem]]
id = "collect-delay"
label = "Collectable after"
unit = "steps"
find = "alarm[0] = ?"
note = "Steps after it's made before the player can collect it."

# Idols, worth their value once carried out of the level.
[[template.idol]]
id = "value"
label = "Base value"
unit = "$"
find = "value = ?"

[[template.idol]]
id = "value-by-area"
label = "Value by area"
unit = "$"
object = "oPlayer1"
event = "step"
find = "global.collect += holdItem.value * ?"
table = { var = "global.levelType", from = 0, to = 3, labels = ["Mines", "Jungle", "Ice Caves", "Temple"], bind = { "holdItem.value" = "value", "global.collect" = 0 } }
note = "Paid when the player carries it through the exit."

